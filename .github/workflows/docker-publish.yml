name: gearflow-inventory-service.docker-publish

# Publica a imagem do Inventory no GHCR em push para main/develop e em tags de release (v*).
# Em PR só faz o build (sem push), para o Dockerfile não quebrar sem ninguém ver.
# O deploy no Kubernetes é o delivery.yml (desligado por variável até o cluster estar acessível): esta imagem é o que ele consome.

on:
  push:
    branches: [ main, develop ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push para ghcr.io usando o GITHUB_TOKEN nativo

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: gearflow-inventory-service
  DOCKERFILE: src/GearFlow.Inventory.Api/Dockerfile

jobs:
  build-push:
    name: Build & push (imagem do Inventory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Contexto = raiz do repositório (o Dockerfile copia Directory.*.props e src/).
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}
