name: gearflow-inventory-service.delivery

# Deploy do Inventory no EKS `gearflow` (AWS Academy; o mesmo cluster do broker e do Billing) depois que o CI da main passa.
# Desligado por padrão: só roda com a variável DEPLOY_ENABLED=true. O workflow_run só dispara a partir da branch padrão (main).
#
# O AWS Academy NÃO tem OIDC nem permite roles novas. Por isso o acesso segue o padrão do infra-broker e do Billing:
#   - credenciais TEMPORÁRIAS da sessão Academy como secrets (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY e AWS_SESSION_TOKEN, que
#     expiram juntos: renove os três antes de cada teste), mais as variáveis AWS_REGION, EKS_CLUSTER_NAME e AWS_ACCOUNT_ID.
#     Podem ser da organização, desde que liberados a este repositório; variável DO REPOSITÓRIO vence a da organização;
#   - o endpoint do EKS tem de ser alcançável pelo runner: este workflow NÃO altera CIDRs (o CD do broker e o do Billing também não).
#     Se não for, o passo "Confere o acesso ao cluster" falha dizendo isso e mostra os CIDRs do endpoint;
#   - a imagem vem do docker-publish (tag sha-<commit>); aqui só se espera ela existir e se fixa o deploy no digest.
# O que este workflow garante no cluster (scripts/bootstrap-cluster.sh, idempotente): namespace `gearflow` com a label
# gearflow.io/messaging-access=true, PostgreSQL exclusivo (k8s/local-postgres, com StorageClass própria) e o Secret
# gearflow-inventory-secret. Precisa já existir o broker (GearFlow CD do infra-broker na main dele): Service `rabbitmq` na 5672 e o
# Secret rabbitmq-inventory-credentials no namespace `messaging`. Veja k8s/README.md.
# Secret do repositório necessário para o bootstrap: JWT_SECRET (o segredo HMAC do grupo, >= 32 caracteres).

on:
  workflow_run:
    workflows: [gearflow-inventory-service.ci]   # tem de ser igual ao `name:` do ci.yml
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: inventory-delivery
  cancel-in-progress: false

jobs:
  verify:
    # Roda o deploy só se ligado, vindo da main e com o CI verde para ESTE commit (o disparo manual também confere).
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Exige o CI verde para o commit exato
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'ci.yml',
              head_sha: process.env.DEPLOY_SHA, branch: 'main', status: 'success', per_page: 100
            });
            if (!data.workflow_runs.some(run => ['push', 'workflow_dispatch'].includes(run.event))) {
              core.setFailed('Rode o CI com sucesso para este commit da main antes do deploy.');
            }

  deploy:
    name: Deploy no Kubernetes
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: inventory-homologation
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_PAGER: ''
      NAMESPACE: gearflow                       # o mesmo de k8s/base/kustomization.yaml
      BROKER_NAMESPACE: messaging               # onde o infra-broker instala o RabbitMQ e os Secrets rabbitmq-<serviço>-credentials
      IMAGE_REPO: ghcr.io/gearflow-fiap/gearflow-inventory-service
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # k8s/base por padrão. O Kong não faz parte do enunciado nem do cluster novo; para publicar a rota, KUSTOMIZE_DIR=k8s/overlays/kong.
      KUSTOMIZE_DIR: ${{ vars.KUSTOMIZE_DIR || 'k8s/base' }}
    steps:
      - name: Isola os arquivos temporários do runner
        shell: bash
        run: |
          echo "KUBECONFIG=$RUNNER_TEMP/gearflow-kubeconfig" >> "$GITHUB_ENV"
          echo "TAG=sha-$DEPLOY_SHA" >> "$GITHUB_ENV"

      - name: Checkout do commit exato que passou no CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Valida as variáveis (região, cluster e conta)
        shell: bash
        run: |
          test "$AWS_REGION" = us-east-1 || { echo "::error::AWS_REGION deve ser us-east-1 (variável liberada a este repositório?)"; exit 1; }
          test "$EKS_CLUSTER_NAME" = gearflow || { echo "::error::EKS_CLUSTER_NAME deve ser gearflow (o cluster do broker e do Billing). Uma variável da organização com o valor antigo gearflow-fase4 é sobrescrita por uma variável do repositório."; exit 1; }
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::AWS_ACCOUNT_ID deve ter 12 dígitos: a conta da sessão Academy dona do cluster gearflow (variável do repositório). Não reaproveite o ID do laboratório antigo."; exit 1; }

      # O docker-publish.yml roda em paralelo ao CI. A imagem é pública, então a consulta não precisa de login.
      - name: Aguarda a imagem no GHCR e resolve o digest
        id: image
        run: |
          for attempt in $(seq 1 40); do
            digest=$(docker buildx imagetools inspect "$IMAGE_REPO:$TAG" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [ -n "$digest" ]; then
              echo "ref=$IMAGE_REPO@$digest" >> "$GITHUB_OUTPUT"
              echo "Imagem: $IMAGE_REPO@$digest"
              exit 0
            fi
            echo "Imagem $TAG ainda não publicada (tentativa $attempt/40)"
            sleep 15
          done
          echo "::error::A imagem $IMAGE_REPO:$TAG não apareceu no GHCR em 10 minutos."
          exit 1

      - name: Autentica com as credenciais temporárias do Academy
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v4 (commit da tag; o SHA do objeto da tag não resolve)
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}   # a conta do cluster gearflow; a sessão de outra conta é recusada
          unset-current-credentials: true
          mask-aws-account-id: true

      # Mesmo critério do CD do broker e do Billing: a versão do kubectl vem do cluster, e o Auto Mode (que não cria StorageClass
      # padrão e usa outro driver EBS) escolhe o perfil de armazenamento do Postgres.
      - name: Lê a versão do cluster e escolhe o perfil de armazenamento do Postgres
        shell: bash
        run: |
          set -euo pipefail
          out=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" \
            --query '[cluster.version, cluster.computeConfig.enabled]' --output text)
          read -r version auto <<< "$out"
          [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::Versão do cluster inesperada: '$version'"; exit 1; }
          if [ "$auto" = True ] || [ "$auto" = true ]; then profile=k8s/local-postgres-auto; else profile=k8s/local-postgres; fi
          echo "KUBECTL_VERSION=v$version.0" >> "$GITHUB_ENV"
          echo "POSTGRES_DIR=$profile" >> "$GITHUB_ENV"
          echo "Cluster $EKS_CLUSTER_NAME: Kubernetes $version, Auto Mode: $auto -> $profile"

      - name: Instala o kubectl compatível com o cluster
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v4 (commit da tag)
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configura o contexto Kubernetes isolado
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --kubeconfig "$KUBECONFIG" --alias gearflow-inventory-cd

      - name: Confere o acesso ao cluster
        run: |
          if ! kubectl get namespace kube-system -o name --request-timeout=30s >/dev/null 2>"$RUNNER_TEMP/kubectl-access.err"; then
            cat "$RUNNER_TEMP/kubectl-access.err"
            echo "::error::Sem acesso ao cluster $EKS_CLUSTER_NAME: o endpoint não é alcançável deste runner (CIDRs restritos, veja abaixo) ou a identidade da sessão Academy não tem acesso Kubernetes (EKS access entry)."
            aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" \
              --query 'cluster.resourcesVpcConfig.{endpointPublicAccess:endpointPublicAccess,endpointPrivateAccess:endpointPrivateAccess,publicAccessCidrs:publicAccessCidrs}' --output json || true
            exit 1
          fi

      # O broker é pré-requisito (CD do infra-broker). Sem TLS: só a 5672 (decisão do grupo em 08/11); se for o antigo (5671 + TLS), não conecta.
      - name: Preflight do broker (Service e credenciais do Inventory)
        run: |
          set -euo pipefail
          kubectl get service rabbitmq -n "$BROKER_NAMESPACE" -o jsonpath='{.spec.ports[*].port}' | grep -qw 5672 || {
            echo "::error::O Service rabbitmq (namespace $BROKER_NAMESPACE) não existe ou não expõe a 5672. O GearFlow CD do infra-broker (versão sem TLS) já rodou neste cluster?"; exit 1; }
          kubectl get secret rabbitmq-inventory-credentials -n "$BROKER_NAMESPACE" >/dev/null || {
            echo "::error::O Secret rabbitmq-inventory-credentials não existe no namespace $BROKER_NAMESPACE (criado pelo bootstrap do infra-broker)."; exit 1; }

      - name: Prepara o namespace, o PostgreSQL e o Secret da aplicação
        id: bootstrap
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: bash scripts/bootstrap-cluster.sh

      - name: Renderiza, valida e aplica
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          SECRET_CHANGED: ${{ steps.bootstrap.outputs.app_secret_changed }}
        run: |
          set -euo pipefail
          existed=$(kubectl get deployment gearflow-inventory -n "$NAMESPACE" --ignore-not-found -o name)
          kubectl kustomize "$KUSTOMIZE_DIR" \
            | sed "s#image: gearflow-inventory-service:unpublished#image: ${IMAGE}#" > "$RUNNER_TEMP/inventory.yaml"
          grep -q "image: ${IMAGE}" "$RUNNER_TEMP/inventory.yaml"
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/inventory.yaml"
          kubectl apply -f "$RUNNER_TEMP/inventory.yaml"
          # Pod só lê Secret na subida: se o conteúdo mudou e o Deployment já existia, reinicia para valer o valor novo.
          if [ "$SECRET_CHANGED" = true ] && [ -n "$existed" ]; then
            echo "O Secret gearflow-inventory-secret mudou: reiniciando o Deployment."
            kubectl rollout restart deployment/gearflow-inventory -n "$NAMESPACE"
          fi
          kubectl rollout status deployment/gearflow-inventory -n "$NAMESPACE" --timeout=300s

      - name: Smoke test em /health/ready (Service interno)
        run: |
          kubectl port-forward -n "$NAMESPACE" service/gearflow-inventory 18080:8080 >"$RUNNER_TEMP/port-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health/ready; then echo; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/port-forward.log" || true
          exit 1

      # O SMTP dos avisos de estoque é o Mailpit que o Billing sobe no namespace (Service `mailpit`). Sem ele a Saga funciona, mas os
      # e-mails falham e vão para a fila `_error`. Por isso é só um aviso: não derruba o deploy.
      - name: Confere o SMTP dos avisos de estoque (só avisa)
        run: |
          host=$(sed -n 's/^  Smtp__Host: *//p' "$RUNNER_TEMP/inventory.yaml" | head -n1 | tr -d '"' | tr -d '\r')
          case "$host" in
            "") echo "::warning::Smtp__Host não encontrado no ConfigMap renderizado."; exit 0 ;;
            *.*) echo "Smtp__Host=$host é um nome completo; não confiro."; exit 0 ;;
          esac
          if kubectl get service "$host" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "SMTP ok: Service $host no namespace $NAMESPACE (interface web: kubectl port-forward -n $NAMESPACE service/$host 8025:8025)."
          else
            echo "::warning::O Service $host não existe no namespace $NAMESPACE (o Billing o sobe no perfil Academy). Sem SMTP os e-mails de estoque falham e vão para a fila _error; a Saga não é afetada."
          fi

      - name: Diagnóstico (só em falha)
        if: failure()
        run: |
          kubectl get pods,pvc,statefulset,deployment -n "$NAMESPACE" -o wide || true
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp | tail -n 30 || true
          kubectl describe pods -n "$NAMESPACE" -l app.kubernetes.io/name=gearflow-inventory | tail -n 40 || true
          kubectl logs -n "$NAMESPACE" -l app.kubernetes.io/name=gearflow-inventory --tail=60 --all-containers || true
          kubectl logs -n "$NAMESPACE" statefulset/inventory-postgres --tail=30 || true
