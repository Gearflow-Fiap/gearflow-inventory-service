name: gearflow-inventory-service.delivery

# Deploy no EKS do gearflow-infra-k8s depois que o CI da main passa. Desligado por padrão: só roda com a variável
# DEPLOY_ENABLED=true. Pré-requisitos (role OIDC, cluster, Secrets no namespace) em k8s/README.md.
# A imagem vem do docker-publish.yml (tag sha-<commit>); aqui só se espera ela existir e se fixa o deploy no digest.

on:
  workflow_run:
    workflows: [gearflow-inventory-service.ci]   # tem de ser igual ao `name:` do ci.yml
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: inventory-delivery
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy no Kubernetes
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: inventory-homologation
    permissions:
      contents: read
      id-token: write   # OIDC com a AWS: sem chave de longa duração no GitHub
    env:
      IMAGE_REPO: ghcr.io/gearflow-fiap/gearflow-inventory-service
      TAG: sha-${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # O docker-publish.yml roda em paralelo ao CI. A imagem é pública, então a consulta não precisa de login.
      - name: Aguarda a imagem no GHCR e resolve o digest
        id: image
        run: |
          for attempt in $(seq 1 40); do
            digest=$(docker buildx imagetools inspect "$IMAGE_REPO:$TAG" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [ -n "$digest" ]; then
              echo "ref=$IMAGE_REPO@$digest" >> "$GITHUB_OUTPUT"
              echo "Imagem: $IMAGE_REPO@$digest"
              exit 0
            fi
            echo "Imagem $TAG ainda não publicada (tentativa $attempt/40)"
            sleep 15
          done
          echo "::error::A imagem $IMAGE_REPO:$TAG não apareceu no GHCR em 10 minutos."
          exit 1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Seleciona o cluster
        env:
          CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Renderiza, valida e aplica
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          kubectl kustomize k8s/overlays/kong \
            | sed "s#image: gearflow-inventory-service:unpublished#image: ${IMAGE}#" > "$RUNNER_TEMP/inventory.yaml"
          grep -q "image: ${IMAGE}" "$RUNNER_TEMP/inventory.yaml"
          kubectl get secret gearflow-inventory-secret -n gearflow >/dev/null || {
            echo "::error::O Secret gearflow-inventory-secret não existe no namespace gearflow (veja k8s/README.md)."; exit 1; }
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/inventory.yaml"
          kubectl apply -f "$RUNNER_TEMP/inventory.yaml"
          kubectl rollout status deployment/gearflow-inventory -n gearflow --timeout=300s

      - name: Smoke test em /health/ready (Service interno)
        run: |
          kubectl port-forward -n gearflow service/gearflow-inventory 18080:8080 >"$RUNNER_TEMP/port-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health/ready; then echo; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/port-forward.log" || true
          exit 1

      - name: Diagnóstico (só em falha)
        if: failure()
        run: |
          kubectl get pods -n gearflow -l app.kubernetes.io/name=gearflow-inventory -o wide || true
          kubectl logs -n gearflow -l app.kubernetes.io/name=gearflow-inventory --tail=60 --all-containers || true
